/* 레이아웃: 위 띠(로고·제목) / 왼쪽 장면 목록 / 가운데 실험대(안내·무대·조작) / 오른쪽 기록판.
   한 가지 모습으로 고정한 디자인(만화 간판식 굵은 테두리 + 딱 떨어지는 그림자). 무대만 어둡게 둔다. */
:root{
  color-scheme: light;
  --ink:#141A2E;
  --paper:#FFF9EC;
  --white:#FFFFFF;
  --bg:#E3ECF7;
  --dot:#C9D7EA;
  --bench:#0F1E33;
  --bench2:#18294A;
  --blue:#01499B;
  --sky:#7CC0FF;
  --sun:#FFD23F;
  --gold:#CBB68A;
  --grass:#38C172;
  --grass-ink:#11663A;
  --blood:#F0524F;
  --blood-ink:#9C1E1B;
  --muted:#4A5A70;
  --line:#E4DAC2;
  --yeast:#E9D59C;

  --display:"Noto Sans KR","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;

  --l:4px; --l-sm:3px;
  --sh:5px 5px 0 var(--ink); --sh-sm:3px 3px 0 var(--ink);
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;font-weight:500;
  background-image:radial-gradient(var(--dot) 1.4px,transparent 1.6px);background-size:18px 18px}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,p{margin:0}
b,strong{font-weight:900}
.hl{background:linear-gradient(transparent 55%,var(--sun) 55%);font-weight:900}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bench)}

/* ---------- 위 띠 ---------- */
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bench);color:var(--paper);
  display:flex;align-items:center;gap:12px;min-height:62px;
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  border-bottom:var(--l) solid var(--ink)}
.ttl{min-width:0;flex:1 1 auto}
.ttl h1{font-family:var(--display);font-weight:900;letter-spacing:-.02em;font-size:24px;line-height:1.1;letter-spacing:.5px;
  color:var(--paper)}
.ttl h1 em{font-style:normal;color:var(--sun)}
.ttl p{font-size:12px;color:#AFC2DD;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{flex:0 0 auto;background:var(--paper);color:var(--ink);border:var(--l-sm) solid var(--ink);border-radius:12px;
  min-height:42px;padding:0 13px;font-weight:900;font-size:13px;box-shadow:3px 3px 0 #000}
.tbtn:active{transform:translate(2px,2px);box-shadow:0 0 0 #000}
.tbtn .n{display:inline-block;min-width:20px;margin-left:4px;padding:0 6px;border-radius:99px;background:var(--sun);border:2px solid var(--ink);font-size:11px;line-height:18px}

/* ---------- 본판 ---------- */
#main{display:grid;grid-template-columns:220px minmax(0,1fr) 380px;gap:18px;align-items:start;
  max-width:1500px;margin:0 auto;padding-block:18px 28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* 장면 목록 */
#rail{position:sticky;top:calc(80px + env(safe-area-inset-top,0px));background:var(--paper);border:var(--l) solid var(--ink);
  border-radius:var(--r);box-shadow:var(--sh);padding:12px 10px;max-height:calc(100vh - 110px);overflow:auto}
.chap{font-size:11px;font-weight:900;color:var(--muted);letter-spacing:.06em;margin:10px 6px 4px}
.chap:first-child{margin-top:0}
.sc{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:2px solid transparent;
  border-radius:10px;padding:5px 7px;font-size:13.5px;font-weight:700;line-height:1.35}
.sc .no{flex:0 0 22px;height:22px;border-radius:99px;border:2px solid var(--ink);display:grid;place-items:center;font-size:11px;font-weight:900;background:var(--white)}
.sc.done .no{background:var(--grass);color:var(--white)}
.sc.now{background:var(--sun);border-color:var(--ink)}
.sc.now .no{background:var(--ink);color:var(--sun)}
.sc:disabled{opacity:.42;cursor:not-allowed}
.sc:not(:disabled):hover{border-color:var(--ink)}
.sc:focus-visible,.btn:focus-visible,.opt:focus-visible,.tbtn:focus-visible,.chip:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* 가운데 실험대 */
#center{min-width:0;display:flex;flex-direction:column;gap:12px}
.head{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap}
.head .tag{background:var(--ink);color:var(--sun);font-size:12px;font-weight:900;border-radius:99px;padding:2px 11px}
.head h2{font-family:var(--display);font-weight:900;letter-spacing:-.02em;font-size:30px;line-height:1.1;text-wrap:balance}
.head .cnt{margin-left:auto;font-size:12px;font-weight:900;color:var(--muted);font-variant-numeric:tabular-nums}
#guide{background:var(--white);border:var(--l) solid var(--ink);border-radius:var(--r);box-shadow:var(--sh);padding:12px 16px;font-size:15.5px;font-weight:700}
#stage{position:relative;height:clamp(330px,56vh,560px);background:var(--bench);border:var(--l) solid var(--ink);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;
  background-image:radial-gradient(rgba(124,192,255,.10) 1.4px,transparent 1.6px);background-size:22px 22px}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hint{position:absolute;left:10px;right:10px;bottom:10px;z-index:3;background:rgba(15,30,51,.86);color:var(--paper);border:2px solid #2E4670;
  border-radius:12px;padding:6px 12px;font-size:13.5px;font-weight:700;text-align:center;pointer-events:none}
#hint:empty{display:none}
#ctrl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
#ctrl:empty{display:none}
.btn{background:var(--paper);border:var(--l-sm) solid var(--ink);border-radius:12px;box-shadow:var(--sh-sm);min-height:44px;padding:0 15px;font-weight:900;font-size:14px;
  display:inline-flex;align-items:center;gap:6px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.btn:active:not(:disabled),.btn.held{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.btn.pri{background:var(--sun)}
.btn.blue{background:var(--blue);color:var(--white)}
.btn.on{background:var(--grass);color:var(--white)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.rng{display:flex;align-items:center;gap:10px;background:var(--paper);border:var(--l-sm) solid var(--ink);border-radius:12px;box-shadow:var(--sh-sm);padding:4px 12px;min-height:44px;font-weight:900;font-size:13.5px;flex:1 1 260px}
.rng input{flex:1 1 auto;min-width:80px;accent-color:var(--blue)}
.rng output{min-width:58px;text-align:right;font-variant-numeric:tabular-nums}
#nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:4px}
#gateMsg{flex:1 1 200px;font-size:13px;font-weight:700;color:var(--muted)}
#gateMsg.ok{color:var(--grass-ink)}
#next{margin-left:auto}

/* 기록판 */
#panel{min-width:0;display:flex;flex-direction:column;gap:14px}
.card{background:var(--white);border:var(--l) solid var(--ink);border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px;min-width:0}
.card h3{font-family:var(--display);font-weight:900;letter-spacing:-.02em;font-size:19px;line-height:1.2;margin-bottom:8px}
.card p+p{margin-top:6px}
.card.req{background:var(--paper)}
.card.req .from{display:inline-block;font-size:12px;font-weight:900;background:var(--blue);color:var(--white);border-radius:99px;padding:1px 10px;margin-bottom:6px}
.muted{color:var(--muted);font-size:13px}
.small{font-size:13px}
.eq{font-weight:900;background:var(--paper);border:2px dashed var(--ink);border-radius:10px;padding:8px 10px;margin-top:8px;text-align:center;font-size:14.5px;overflow-x:auto}
.tw{overflow-x:auto;margin-top:4px}
table.dat{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
table.dat th,table.dat td{border:2px solid var(--ink);padding:5px 7px;text-align:center}
table.dat th{background:#F4EAD0;font-weight:900}
table.dat td.l{text-align:left}
ul.tight{margin:4px 0 0;padding-left:1.15em}
ul.tight li+li{margin-top:3px}

/* 문항 */
.quiz .q{font-weight:900;font-size:15px;margin-bottom:8px}
.quiz .q .qn{display:inline-block;background:var(--ink);color:var(--sun);border-radius:8px;font-size:11.5px;padding:0 7px;margin-right:6px;vertical-align:2px}
.quiz.adv{border-color:var(--blue);box-shadow:5px 5px 0 var(--blue)}
.quiz.adv .q .qn{background:var(--blue);color:var(--white)}
.quiz .ctx{background:#F2F6FC;border:2px solid #C3D3EA;border-radius:10px;padding:8px 10px;font-size:13.5px;margin-bottom:8px}
.quiz .ctx p+p{margin-top:3px}
.pred{display:flex;flex-direction:column;gap:10px}
.prow{background:var(--paper);color:var(--ink);border:var(--l-sm) solid var(--ink);border-radius:14px;padding:8px 10px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;box-shadow:4px 4px 0 #000}
.prow .pt{flex:1 1 220px;font-size:13.5px;font-weight:700;min-width:0}
.prow .pt b{display:inline-block;background:var(--ink);color:var(--sun);border-radius:8px;padding:0 7px;margin-right:6px}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:10px;overflow:hidden}
.seg button{border:0;border-left:2px solid var(--ink);background:var(--white);padding:5px 11px;font-weight:900;font-size:13px}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--sun)}
.seg button.ok{background:#CFF3DE}
.seg button.bad{background:#FFE0DF}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{text-align:left;background:var(--paper);border:var(--l-sm) solid var(--ink);border-radius:12px;padding:8px 11px;font-size:14px;font-weight:700;line-height:1.45;box-shadow:var(--sh-sm)}
.opt:active{transform:translate(2px,2px);box-shadow:none}
.opt.ok{background:#CFF3DE;border-color:var(--grass-ink)}
.opt.bad{background:#FFE0DF;border-color:var(--blood-ink)}
.quiz.solved .opt:not(.ok){opacity:.55}
.fb{margin-top:9px;border-radius:12px;padding:9px 11px;font-size:13.5px;font-weight:600;border:2px solid}
.fb.ok{background:#E9FBF0;border-color:var(--grass-ink)}
.fb.bad{background:#FFF0EF;border-color:var(--blood-ink)}
.fb .v{display:block;font-weight:900;margin-bottom:2px}

/* 변인 칩 */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--white);color:var(--ink);border:var(--l-sm) solid var(--ink);border-radius:99px;padding:6px 12px;font-size:13.5px;font-weight:900;box-shadow:var(--sh-sm);touch-action:manipulation}
.chip.pick{background:var(--sun);transform:translate(-1px,-2px)}
.chip.wrong{background:#FFE0DF;animation:shake .35s}
.chip.right{background:#CFF3DE}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* 무대 위 HTML (변인표·설계표) */
.ov{position:absolute;inset:0;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px;color:var(--paper)}
.ov .lbl{font-size:12px;font-weight:900;color:var(--sun);letter-spacing:.05em}
.vt{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;min-width:0}
.bin{background:var(--paper);color:var(--ink);border:var(--l-sm) solid var(--ink);border-radius:14px;min-height:150px;padding:8px;display:flex;flex-direction:column;gap:6px;cursor:pointer;
  box-shadow:4px 4px 0 #000}
.bin .bh{font-size:12px;font-weight:900;text-align:center;border-bottom:2px solid var(--ink);padding-bottom:4px}
.bin .bh small{display:block;font-size:10.5px;color:var(--muted)}
.bin.target{outline:3px dashed var(--sun);outline-offset:3px}
.bin .chip{align-self:flex-start;font-size:12.5px;padding:4px 10px;box-shadow:none}
.amt{border-collapse:collapse;width:100%;background:var(--paper);color:var(--ink);font-size:14px;font-variant-numeric:tabular-nums;border:var(--l-sm) solid var(--ink)}
.amt th,.amt td{border:2px solid var(--ink);padding:5px 6px;text-align:center}
.amt th{background:#F4EAD0}
.amt td.given{font-weight:900;color:var(--blue)}
.stp{display:inline-flex;align-items:center;gap:4px}
.stp button{width:30px;height:30px;border:2px solid var(--ink);border-radius:8px;background:var(--white);font-weight:900;line-height:1;padding:0}
.stp output{min-width:28px;font-weight:900}
.amt td.badc{background:#FFE0DF}

/* 알림 */
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;max-width:min(560px,calc(100vw - 32px));
  background:var(--ink);color:var(--paper);border:var(--l-sm) solid var(--sun);border-radius:14px;padding:10px 16px;font-weight:700;font-size:14px;box-shadow:4px 4px 0 rgba(0,0,0,.4)}
#toast.good{border-color:var(--grass)}
#toast.bad{border-color:var(--blood)}

/* 실험노트 */
#noteDlg{position:fixed;inset:0;z-index:40;background:rgba(15,30,51,.6);display:grid;place-items:center;padding:16px}
#noteDlg .box{background:var(--paper);border:var(--l) solid var(--ink);border-radius:var(--r);box-shadow:var(--sh);width:min(680px,100%);max-height:calc(100vh - 40px);overflow:auto;padding:18px 20px}
#noteDlg h3{font-family:var(--display);font-weight:900;letter-spacing:-.02em;font-size:24px}
.nt{border-top:2px dashed var(--line);padding-top:10px;margin-top:10px}
.nt b{display:block;font-size:14px}
.nt pre{margin:4px 0 0;white-space:pre-wrap;font-family:var(--sans);font-size:13.5px;font-weight:500}
.stars{display:flex;gap:4px}
.stars button{border:0;background:none;font-size:24px;line-height:1;padding:2px;color:#C9BFA8}
.stars button.on{color:#E0A400}
.ev{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;border-top:2px dashed var(--line);padding-top:8px;margin-top:8px}
.ev:first-of-type{border-top:0;margin-top:0;padding-top:0}
.ev span{font-size:13.5px;font-weight:700;flex:1 1 200px}
.ev span i{font-style:normal;font-weight:900;color:var(--blue)}

/* ---------- 좁은 화면 ---------- */
@media (max-width:1180px){
  #main{grid-template-columns:minmax(0,1fr) 340px}
  #rail{grid-column:1/-1;position:static;max-height:none;display:flex;gap:6px;overflow-x:auto;padding:8px}
  #rail .chap{display:none}
  .sc{flex:0 0 auto;width:auto;white-space:nowrap}
}
@media (max-width:820px){
  #main{grid-template-columns:minmax(0,1fr);gap:14px}
  #stage{height:clamp(300px,58vh,460px)}
  .head h2{font-size:25px}
  .ttl h1{font-size:20px}
  .vt{grid-template-columns:1fr}
  .bin{min-height:86px}
}
@media (max-width:480px){
  #top .tbtn.wide{display:none}
  .btn{padding:0 12px;font-size:13.5px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<header id="top">
  <div class="ttl"><h1>효모 <em>발효</em> 실험실</h1><p>탐구 · 발효 실험 설계하여 수행하기 · 교과서 98~99쪽</p></div>
  <button class="tbtn" id="noteBtn" type="button">실험노트<span class="n" id="noteN">0</span></button>
  <button class="tbtn wide" id="resetBtn" type="button">처음부터</button>
</header>

<main id="main">
  <nav id="rail" aria-label="장면 목록"></nav>
  <section id="center">
    <div class="head"><span class="tag" id="chapTag"></span><h2 id="scName"></h2><span class="cnt" id="cnt"></span></div>
    <div id="guide"></div>
    <div id="stage"><div id="hint"></div></div>
    <div id="ctrl"></div>
    <div id="nav">
      <button class="btn" id="prev" type="button">◀ 이전</button>
      <span id="gateMsg"></span>
      <button class="btn pri" id="next" type="button">다음 ▶</button>
    </div>
  </section>
  <aside id="panel"></aside>
</main>
<div id="toast" hidden></div>
<div id="noteDlg" hidden><div class="box" role="dialog" aria-modal="true" aria-labelledby="ndT">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><h3 id="ndT">실험노트</h3>
  <button class="btn" id="noteCopy" type="button" style="margin-left:auto">전체 복사</button><button class="btn" id="noteClose" type="button">닫기</button></div>
  <p class="muted">확인 문항을 맞히면 그 장면에서 확인한 내용이 여기에 적힙니다.</p>
  <div id="noteBody"></div>
  <textarea id="noteTxt" readonly hidden style="width:100%;height:160px;margin-top:10px"></textarea>
</div></div>

<script>
(function(){
'use strict';
/* =====================================================================
   효모 발효 실험실 — 교과서 98~99쪽 탐구 「발효 실험 설계하여 수행하기」
   [수치] 기체 부피는 경향을 보이기 위한 학습용 모형 값이다(실측 아님). 화면에도 밝혀 둔다.
     40 ℃, 20 분 기준: 포도당(B) 6.3 mL, 녹말(C) 0.2 mL, 증류수(A) 0 mL.
     효모(Saccharomyces cerevisiae)는 녹말 분해 효소(아밀레이스)가 없어 녹말을 쓰지 못한다.
     C 의 0.2 mL 는 녹말 용액에 섞인 소량의 엿당·덱스트린 몫으로 둔다.
     처음 2 분의 지연: 생긴 CO2 가 먼저 용액에 녹아 포화될 때까지 기체로 모이지 않고, 건조 효모가 활동을 되찾는 시간.
     온도 의존: 35~40 ℃ 근처에서 가장 활발하고 50 ℃ 를 넘으면 급감하는 종 모양.
   ===================================================================== */
var KEY='dtja-yeast-lab-v2';
var INK='#141A2E', PAPER='#FFF9EC', SUN='#FFD23F', SKY='#7CC0FF', BLUE='#01499B', GRASS='#38C172', BLOOD='#F0524F', YEAST='#E9D59C', GLASS='rgba(214,236,255,.30)';

/* ---------------- 저장 ---------------- */
function fresh(){return {cur:0,max:0,ans:{},notes:{},noteOrder:[],worn:{},yeastIn:0,stir:0,bins:{},amt:null,filled:0,run:null,meas:{},rec:{},koh:0,smell:0,stars:{}};}
var D=fresh();
try{var raw=localStorage.getItem(KEY); if(raw){var o=JSON.parse(raw); for(var k in o) D[k]=o[k];}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D));}catch(e){}}

/* ---------------- 작은 도구 ---------------- */
function $(id){return document.getElementById(id);}
function el(tag,cls,html){var e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function fmt(v){return (Math.round(v*10)/10).toFixed(1);}
var toastT=null;
function toast(msg,kind){var t=$('toast'); t.innerHTML=msg; t.className=kind||''; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(function(){t.hidden=true;},3600);}
function hint(s){$('hint').innerHTML=s||'';}
function note(key,title,text){
  if(!D.notes[key]) D.noteOrder.push(key);
  D.notes[key]={t:title,x:text}; save(); $('noteN').textContent=D.noteOrder.length;
}

/* ---------------- 모형 ---------------- */
function tempF(T){ /* 상대 활성 — 40 ℃ 에서 1 */
  function g(T){var s=T<=38?10:5.5, d=T-38; return Math.exp(-d*d/(2*s*s));}
  return g(T)/g(40);
}
var RATE={A:0, B:0.35, C:0.2/15}, LAG={A:0,B:2,C:5}, CAP=9.6;
function simStep(r,dt){ /* r={t,T,v:{A,B,C}} dt 분 */
  var f=tempF(r.T);
  ['A','B','C'].forEach(function(k){
    var t0=r.t, t1=r.t+dt, on=Math.max(0,t1-Math.max(t0,LAG[k]));
    r.v[k]=Math.min(CAP,r.v[k]+RATE[k]*f*on);
  });
  r.t+=dt;
}
var TRUE20={A:0,B:6.3,C:0.2};

/* ---------------- 캔버스 엔진 ---------------- */
var live=null; /* 현재 장면의 정리 함수들 */
function canvas(draw){
  var stage=$('stage'), cv=el('canvas'); stage.insertBefore(cv,$('hint'));
  var c=cv.getContext('2d'), W=1,H=1, dpr=1, t0=performance.now(), raf=0, dead=false;
  function fit(){dpr=Math.min(2,window.devicePixelRatio||1); var r=stage.getBoundingClientRect(); W=Math.max(1,r.width-8);H=Math.max(1,r.height-8);
    cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);}
  fit(); var ro=new ResizeObserver(fit); ro.observe(stage);
  var last=t0;
  function loop(now){ if(dead)return; var t=(now-t0)/1000, dt=Math.min(.1,(now-last)/1000); last=now;
    c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,W,H);
    try{draw(c,W,H,t,dt);}catch(err){console.error(err);}
    raf=requestAnimationFrame(loop);}
  raf=requestAnimationFrame(loop);
  var api={cv:cv,pt:function(ev){var r=cv.getBoundingClientRect();return{x:ev.clientX-r.left,y:ev.clientY-r.top};},
    size:function(){return{w:W,h:H};}};
  live.push(function(){dead=true;cancelAnimationFrame(raf);ro.disconnect();cv.remove();});
  return api;
}
function on(elm,ev,fn,opt){elm.addEventListener(ev,fn,opt); live.push(function(){elm.removeEventListener(ev,fn,opt);});}

/* ---------------- 그림 도구 ---------------- */
function rr(c,x,y,w,h,r){w=Math.max(0,w);h=Math.max(0,h);r=Math.max(0,Math.min(r,w/2,h/2));c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function txt(c,s,x,y,o){o=o||{};c.save();c.font=(o.w||700)+' '+(o.size||13)+'px "Noto Sans KR","Malgun Gothic",sans-serif';c.fillStyle=o.col||PAPER;c.textAlign=o.al||'center';c.textBaseline=o.bl||'middle';c.fillText(s,x,y);c.restore();}
function chip(c,s,x,y,bg,size){size=size||12;c.save();c.font='900 '+size+'px "Noto Sans KR",sans-serif';var w=c.measureText(s).width+18,h=size+12;
  rr(c,x-w/2+2,y-h/2+3,w,h,h/2);c.fillStyle='rgba(0,0,0,.45)';c.fill();
  rr(c,x-w/2,y-h/2,w,h,h/2);c.fillStyle=bg||PAPER;c.fill();c.lineWidth=2.5;c.strokeStyle=INK;c.stroke();
  c.fillStyle=INK;c.textAlign='center';c.textBaseline='middle';c.fillText(s,x,y+.5);c.restore();}
function tap(c,x,y,t){ /* 눌러 보라는 손짓 고리 */
  var k=(t*1.1)%1; c.save();c.globalAlpha=1-k;c.beginPath();c.arc(x,y,10+k*22,0,7);c.strokeStyle=SUN;c.lineWidth=3;c.stroke();c.restore();
  c.save();c.beginPath();c.arc(x,y,7,0,7);c.fillStyle=SUN;c.fill();c.lineWidth=2.5;c.strokeStyle=INK;c.stroke();c.restore();}

/* 발효관 — 지역 좌표(단위 px, s 배율). 받침 바닥이 (0,0).
   맹관부: x=-28, y -290(막힌 끝) ~ -90. 굽은 곳: 중심 (0,-90) 반지름 28. 열린 쪽 팔: x=28, -90 ~ -150.
   공 모양 부분: 중심 (28,-190). 입구 목: -228 ~ -262. 눈금 0 mL 은 y=-290, 10 mL 은 y=-110 (1 mL = 18). */
var TW=22;
function tubePath(c){c.beginPath();c.moveTo(-28,-290);c.lineTo(-28,-90);c.arc(0,-90,28,Math.PI,0,true);c.lineTo(28,-150);}
function drawTube(c,o){
  c.save();c.translate(o.x,o.y);c.scale(o.s,o.s);
  if(o.tilt){c.translate(0,-90);c.rotate(o.tilt);c.translate(0,90);}
  var liq=o.liq||YEAST, gas=clamp(o.gas||0,0,CAP), air=o.air||0, bulb=o.bulb==null?.55:o.bulb; /* bulb: 공 부분 액면 0~1 */
  /* 받침 */
  if(!o.noStand){c.save();c.beginPath();c.ellipse(4,2,50,10,0,0,7);c.fillStyle='rgba(0,0,0,.4)';c.fill();
    c.beginPath();c.ellipse(0,-4,46,9,0,0,7);c.fillStyle='#DDE6F2';c.fill();c.lineWidth=3;c.strokeStyle=INK;c.stroke();
    c.beginPath();c.moveTo(0,-8);c.lineTo(0,-62);c.lineWidth=14;c.strokeStyle=INK;c.stroke();c.lineWidth=8;c.strokeStyle='#DDE6F2';c.stroke();c.restore();}
  c.lineCap='round';c.lineJoin='round';
  /* 바깥선 */
  tubePath(c);c.lineWidth=TW+6;c.strokeStyle=INK;c.stroke();
  c.beginPath();c.ellipse(28,-190,38,40,0,0,7);c.fillStyle=INK;c.fill();
  c.beginPath();c.moveTo(28,-222);c.lineTo(28,-262);c.lineWidth=28;c.strokeStyle=INK;c.stroke();
  /* 유리 */
  tubePath(c);c.lineWidth=TW;c.strokeStyle='#E8F3FF';c.stroke();
  c.beginPath();c.ellipse(28,-190,34.5,36.5,0,0,7);c.fillStyle='#E8F3FF';c.fill();
  c.beginPath();c.moveTo(28,-222);c.lineTo(28,-262);c.lineWidth=22;c.strokeStyle='#E8F3FF';c.stroke();
  /* 액체 — 굽은 곳·열린 팔 */
  if(o.empty!==true){
    var lw=TW-5;
    c.beginPath();c.moveTo(-28,-96);c.arc(0,-90,28,Math.PI,0,true);c.lineTo(28,-150);c.lineWidth=lw;c.strokeStyle=liq;c.stroke();
    /* 맹관부 액체: 기체·공기 아래쪽 */
    var topY=-290+Math.max(gas*18,air*180);
    if(topY<-96){c.beginPath();c.moveTo(-28,-96);c.lineTo(-28,topY+ (topY<=-288?0:3));c.lineCap='butt';c.lineWidth=lw;c.strokeStyle=liq;c.stroke();c.lineCap='round';}
    if(gas>0.02||air>0.01){ /* 기체와 용액의 경계면 */
      c.beginPath();c.moveTo(-28-lw/2,topY+3);c.quadraticCurveTo(-28,topY-2,-28+lw/2,topY+3);c.lineWidth=2;c.strokeStyle='rgba(20,26,46,.7)';c.stroke();}
    /* 공 부분 */
    c.save();c.beginPath();c.ellipse(28,-190,32,34,0,0,7);c.clip();
    var ly=-156-bulb*68;c.fillStyle=liq;c.fillRect(-10,ly,80,120);
    c.beginPath();c.moveTo(-10,ly);c.lineTo(70,ly);c.lineWidth=2;c.strokeStyle='rgba(20,26,46,.5)';c.stroke();c.restore();
    if(o.neckLiq){c.beginPath();c.moveTo(28,-224);c.lineTo(28,-224-o.neckLiq*34);c.lineCap='butt';c.lineWidth=17;c.strokeStyle=liq;c.stroke();c.lineCap='round';}
  }
  /* 기포 */
  if(o.rate>0&&o.t!=null){var n=Math.round(4+o.rate*14), top=-290+gas*18+6;
    for(var i=0;i<n;i++){var ph=((o.t*(0.25+o.rate*0.6))+i/n)%1, yy=-96-ph*(-96-top)*1, xx=-28+Math.sin(o.t*3+i*2.3)*4;
      if(yy>top){c.beginPath();c.arc(xx,yy,1.6+((i*7)%3)*.6,0,7);c.fillStyle='rgba(255,255,255,.9)';c.fill();c.lineWidth=.8;c.strokeStyle='rgba(20,26,46,.6)';c.stroke();}}}
  /* 눈금 */

      else h+='<div class="fb bad"><span class="v">다시 생각해 보세요.</span>'+((Q.bad&&Q.bad[a.pick])||'')+'</div>';}

  P.innerHTML='<div class="card"><h3>효모는 어떤 생물일까</h3><p>효모는 하나의 세포로 이루어진 <b>균류</b>입니다. 산소가 있으면 세포 호흡을, 산소가 없으면 <b>알코올 발효</b>를 하여 에너지를 얻습니다.</p>'+

   ctx:'<p>포도당 1분자당 얻는 ATP — 세포 호흡: 최대 32분자 / 알코올 발효: 2분자</p>',
   opts:['포도당을 더 적게 분해해도 된다','같은 양의 포도당을 분해하면 된다','포도당을 훨씬 더 많이 분해해야 한다','포도당 대신 에탄올을 분해해야 한다'],a:2,

/* ---- 3. 변인 설정 ---- */

 {k:'tv',t:'용액 전체의 양',bin:'c',w:'발효관마다 넣는 전체 양을 같게 맞춰야 합니다. 통제 변인입니다.'},
 {k:'tp',t:'온도 (40 ℃)',bin:'c',w:'모두 같은 항온기에 넣어 같은 온도로 둡니다. 통제 변인입니다.'},
 {k:'tm',t:'발효 시간',bin:'c',w:'같은 시간이 지난 뒤에 비교해야 합니다. 통제 변인입니다.'},
 {k:'gv',t:'맹관부에 모인 기체의 부피',bin:'d',w:'실험 결과로 측정하는 값입니다. 종속 변인입니다.'}];
SC.push({id:'vars',chap:'탐구 설계',name:'변인 설정',
 guide:'가설을 검증하기 위한 변인을 정합니다. 아래 칩을 하나 누른 뒤 <span class="hl">들어갈 칸</span>을 누르세요. 칸에 든 칩을 다시 누르면 빠집니다.',
 mount:function(P){
  var picked=null, wrong={};
  var st=$('stage'), ov=el('div','ov'); st.insertBefore(ov,$('hint')); live.push(function(){ov.remove();});
  hint('');
  function render(){
    var h='<div class="lbl">변인 칩</div><div class="chips">';
    CHIPS.forEach(function(ch){if(!D.bins[ch.k])h+='<button type="button" class="chip'+(picked===ch.k?' pick':'')+'" data-k="'+ch.k+'">'+ch.t+'</button>';});
    if(CHIPS.every(function(ch){return D.bins[ch.k];}))h+='<span class="small" style="color:#AFC2DD">칩을 모두 넣었습니다. 「확인」을 누르세요.</span>';
    h+='</div><div class="vt">';
    [['m','조작 변인','독립 변인'],['c','통제 변인','독립 변인'],['d','종속 변인','결과']].forEach(function(b){
      h+='<div class="bin'+(picked?' target':'')+'" data-b="'+b[0]+'"><div class="bh">'+b[1]+'<small>'+b[2]+'</small></div>';
      CHIPS.forEach(function(ch){if(D.bins[ch.k]===b[0])h+='<button type="button" class="chip'+(wrong[ch.k]===1?' wrong':wrong[ch.k]===2?' right':'')+'" data-k="'+ch.k+'" data-in="1">'+ch.t+'</button>';});
      h+='</div>';});
    h+='</div>';ov.innerHTML=h;
    ov.querySelectorAll('.chip').forEach(function(b){b.onclick=function(e){e.stopPropagation();var k=b.dataset.k;
      if(b.dataset.in){delete D.bins[k];delete wrong[k];picked=k;save();render();sync();return;}
      picked=picked===k?null:k;render();};});
    ov.querySelectorAll('.bin').forEach(function(b){b.onclick=function(){if(!picked)return;D.bins[picked]=b.dataset.b;delete wrong[picked];picked=null;save();render();sync();};});
  }
  var chk=button('확인','pri',function(){
    var all=CHIPS.every(function(ch){return D.bins[ch.k];});
    if(!all){toast('칩을 모두 칸에 넣은 뒤 확인하세요.','bad');return;}
    var bad=CHIPS.filter(function(ch){return D.bins[ch.k]!==ch.bin;});
    CHIPS.forEach(function(ch){wrong[ch.k]=D.bins[ch.k]===ch.bin?2:1;});
    if(bad.length){toast('<b>'+bad[0].t+'</b> — '+bad[0].w+(bad.length>1?' (틀린 칩 '+bad.length+'개)':''),'bad');D.varsOK=0;}
    else{D.varsOK=1;toast('변인 설정이 맞습니다.','good');note('n3','변인 설정','조작 변인: 호흡기질의 종류(포도당, 녹말, 없음)\n통제 변인: 효모액의 양, 용액 전체의 양, 온도(40 ℃), 발효 시간\n종속 변인: 맹관부에 모인 기체(이산화 탄소)의 부피');}
    save();render();sync();});
  button('비우기','',function(){D.bins={};D.varsOK=0;wrong={};picked=null;save();render();sync();});
  P.innerHTML='<div class="card"><h3>변인 정리</h3><p class="small"><b>조작 변인</b> 결과에 영향을 주는지 알아보려고 일부러 바꾸는 조건</p>'+
   '<p class="small"><b>통제 변인</b> 결과에 영향을 줄 수 있어 모든 실험 무리에서 같게 맞추는 조건</p>'+
   '<p class="small"><b>종속 변인</b> 조작 변인을 바꾼 결과로 달라지는지 측정하는 값</p></div>'+
   '<div class="card"><h3>교과서 표</h3><div class="tw"><table class="dat"><tr><th colspan="2">독립변인</th><th rowspan="2">종속변인</th></tr><tr><th>조작변인</th><th>통제변인</th></tr>'+
   '<tr><td id="vM">?</td><td id="vC">?</td><td id="vD">?</td></tr></table></div></div>';
  var QA={id:'qa_boil',adv:1,q:'한 모둠이 발효관 D 를 하나 더 두었습니다. D 를 추가하면 무엇을 더 확인할 수 있을까요?',
   ctx:'<p><b>D</b> : 끓였다가 식힌 효모액 15 mL + 5 % 포도당 용액 20 mL</p>',
   opts:['포도당 용액이 온도에 따라 기체를 내놓는지','B 에서 생긴 기체가 살아 있는 효모(효모 속 효소의 작용) 때문에 생긴 것인지','효모가 녹말을 분해할 수 있는지','끓이면 포도당이 녹말로 바뀌는지'],a:1,
   why:'D 는 B 와 <b>효모가 살아 있는지</b>만 다릅니다. 끓이면 효모가 죽고 발효에 관여하는 효소가 <b>변성</b>됩니다. D 에서 기체가 생기지 않으면, B 의 기체는 포도당 스스로가 아니라 <b>살아 있는 효모의 발효</b>로 생겼다고 말할 수 있습니다.',
   bad:{0:'D 와 B 는 모두 40 ℃ 항온기에 넣습니다. 온도는 같습니다.',2:'D 에는 녹말이 없습니다. 녹말은 C 에서 비교합니다.',3:'끓인 것은 효모액이고, 포도당은 끓여도 녹말로 바뀌지 않습니다.'}};
  quiz(P,QA,sync);
  function sync(){
    var put=function(b){return CHIPS.filter(function(ch){return D.bins[ch.k]===b;}).map(function(ch){return ch.t;}).join(', ')||'?';};
    $('vM').textContent=put('m');$('vC').textContent=put('c');$('vD').textContent=put('d');
    if(D.varsOK&&ok('qa_boil'))note('n3b','[심화] 대조 실험 추가','끓였다 식힌 효모액 + 포도당(D)을 두면 기체가 살아 있는 효모(효소)의 작용으로 생겼는지 확인할 수 있다.');
    gate(D.varsOK&&ok('qa_boil'),!D.varsOK?'칩 여섯 개를 알맞은 칸에 넣고 「확인」을 누르세요':'심화 문항을 풀면 넘어갑니다');}

 }});

/* ---- 4. 용액 양 정하기 ---- */
var ROWS=[['y','효모액'],['w','증류수'],['g','5 % 포도당 용액'],['s','5 % 녹말 용액']];
var GIVEN={'B.y':15,'A.g':0,'B.g':20,'A.s':0,'C.s':20};
var ANSW={A:{y:15,w:20,g:0,s:0},B:{y:15,w:0,g:20,s:0},C:{y:15,w:0,g:0,s:20}};
SC.push({id:'amount',chap:'탐구 설계',name:'넣을 양 정하기',
 guide:'설정한 변인에 따라 <span class="hl">각 발효관에 넣을 용액의 양</span>(mL)을 정합니다. 파란 숫자는 교과서에 주어진 값입니다. 빈칸을 −/＋로 채우세요.',
 mount:function(P){
  if(!D.amt){D.amt={A:{y:0,w:0,g:0,s:0},B:{y:15,w:0,g:20,s:0},C:{y:0,w:0,g:0,s:20}};}
  var bad={};
  var stg=$('stage'), ov=el('div','ov'); ov.style.justifyContent='flex-start'; stg.insertBefore(ov,$('hint')); live.push(function(){ov.remove();});
  var cvHost=el('div');cvHost.style.cssText='position:relative;flex:1 1 150px;min-height:150px';
  function render(){
    var h='<div class="lbl">각 발효관에 넣을 용액의 양 (단위: mL)</div><div class="tw"><table class="amt"><tr><th>용액 \\ 발효관</th><th>A</th><th>B</th><th>C</th></tr>';
    ROWS.forEach(function(r){h+='<tr><th>'+r[1]+'</th>';['A','B','C'].forEach(function(t){var key=t+'.'+r[0];
      if(GIVEN[key]!=null)h+='<td class="given">'+GIVEN[key]+'</td>';
      else h+='<td class="'+(bad[key]?'badc':'')+'"><span class="stp"><button type="button" data-k="'+key+'" data-d="-5" aria-label="'+t+' '+r[1]+' 줄이기">−</button><output>'+D.amt[t][r[0]]+'</output><button type="button" data-k="'+key+'" data-d="5" aria-label="'+t+' '+r[1]+' 늘리기">＋</button></span></td>';});
      h+='</tr>';});
    h+='<tr><th>합계</th>';['A','B','C'].forEach(function(t){var a=D.amt[t];h+='<td><b>'+(a.y+a.w+a.g+a.s)+'</b></td>';});h+='</tr></table></div>';
    ov.innerHTML=h; ov.appendChild(cvHost);
    ov.querySelectorAll('.stp button').forEach(function(b){b.onclick=function(){var p=b.dataset.k.split('.');D.amt[p[0]][p[1]]=clamp(D.amt[p[0]][p[1]]+(+b.dataset.d),0,35);delete bad[b.dataset.k];D.amtOK=0;save();render();sync();};});
  }
  /* 작은 미리보기 — 눈금 실린더 세 개에 층으로 쌓인다 */
  var cvs=el('canvas');cvs.style.cssText='position:absolute;inset:0;width:100%;height:100%';cvHost.appendChild(cvs);
  var cc=cvs.getContext('2d'),raf=0;
  function pv(){var r=cvHost.getBoundingClientRect(),dpr=Math.min(2,devicePixelRatio||1);
    if(cvs.width!==Math.round(r.width*dpr)){cvs.width=Math.round(r.width*dpr);cvs.height=Math.round(r.height*dpr);}
    cc.setTransform(dpr,0,0,dpr,0,0);cc.clearRect(0,0,r.width,r.height);
    var cols={y:YEAST,w:'#BFE0FF',g:'#FFF3B0',s:'#F2F2F2'};
    ['A','B','C'].forEach(function(t,i){var x=r.width*(0.2+i*0.3)-22,top=8,hh=r.height-36,ww=44,sc=hh/40,a=D.amt[t],y=top+hh;
      cc.save();rr(cc,x,top,ww,hh,6);cc.clip();
      ['y','w','g','s'].forEach(function(k){var v=a[k]*sc;if(v>0){cc.fillStyle=cols[k];cc.fillRect(x,y-v,ww,v);cc.strokeStyle='rgba(20,26,46,.35)';cc.lineWidth=1;cc.beginPath();cc.moveTo(x,y-v);cc.lineTo(x+ww,y-v);cc.stroke();}y-=v;});
      cc.restore();rr(cc,x,top,ww,hh,6);cc.lineWidth=3;cc.strokeStyle=PAPER;cc.stroke();
      var ly=top+hh-35*sc;cc.setLineDash([4,3]);cc.beginPath();cc.moveTo(x-8,ly);cc.lineTo(x+ww+8,ly);cc.strokeStyle=SUN;cc.lineWidth=2;cc.stroke();cc.setLineDash([]);
      txt(cc,t,x+ww/2,r.height-14,{size:14,w:900});});
    txt(cc,'노란 점선 = 35 mL',r.width-6,10,{size:11,al:'right',col:'#AFC2DD'});
    raf=requestAnimationFrame(pv);}
  live.push(function(){cancelAnimationFrame(raf);});
  button('확인','pri',function(){
    bad={};var msg=null;
    ['A','B','C'].forEach(function(t){ROWS.forEach(function(r){var key=t+'.'+r[0];if(GIVEN[key]==null&&D.amt[t][r[0]]!==ANSW[t][r[0]])bad[key]=1;});});
    var tot=function(t){var a=D.amt[t];return a.y+a.w+a.g+a.s;};
    if(D.amt.A.y!==15||D.amt.C.y!==15)msg='효모액의 양은 <b>통제 변인</b>입니다. B 와 같게 모두 15 mL 로 맞추세요.';
    else if(D.amt.A.g+D.amt.A.s>0||D.amt.C.g>0||D.amt.B.s>0)msg='한 발효관에는 <b>기질 한 가지</b>만 넣어야 어떤 기질의 효과인지 가려낼 수 있습니다.';
    else if(tot('A')!==tot('B')||tot('C')!==tot('B'))msg='용액 전체의 양이 발효관마다 다릅니다. <b>증류수</b>로 B, C 와 같은 35 mL 를 맞추세요.';
    else if(Object.keys(bad).length)msg='빨간 칸을 다시 확인하세요.';
    if(msg){D.amtOK=0;toast(msg,'bad');}
    else{D.amtOK=1;toast('설계가 맞습니다. A 는 기질이 없는 대조군입니다.','good');}
    save();render();sync();});

SC.push({id:'fill',chap:'탐구 수행',name:'발효관 채우기',

 mount:function(P){

    }

    if(S.vol>=35&&S.air===0&&!S.cotton&&S.tilt>5)hint('다 넣었습니다. 기울기를 0° 로 돌려 발효관을 세우세요');
    else if(S.vol>=35&&S.air>0)hint('맹관부 끝에 공기가 남았습니다. 다시 기울여 공기를 빼세요');
    else if(!S.cotton&&S.vol>=35&&S.air===0)hint('맹관부에 기체가 없는 것을 확인했습니다. 「솜으로 막기」를 누르세요');
    else if(!S.cotton)hint(steep?'좋습니다. 이 기울기면 용액이 맹관부 끝까지 들어갑니다':'기울기가 작으면 용액이 맹관부로 들어가지 못합니다 (60° 이상)');
    else hint(D.filled>=2?'A, B, C 세 발효관을 모두 준비했습니다':'B 완료. 「A, C 도 같은 방법으로」를 누르세요');
    cotB.disabled=!(S.vol>=35&&S.air===0&&S.tilt<=5&&!S.cotton);
    pourB.disabled=S.cotton||S.vol>=35;
    allB.disabled=!S.cotton||D.filled>=2;
  });
  tiltR=range('기울기',0,80,5,S.tilt,'°',function(v){S.tilt=v;});
  pourB=holdButton('붓기 (누르고 있기)','pri',function(){S.pour=true;},function(){S.pour=false;});

  P.innerHTML='<div class="card"><h3>발효관을 이용한 실험 방법</h3><ol class="tight" style="padding-left:1.2em"><li>발효관을 기울여 맹관부가 가득 차게 내용물을 넣는다.</li><li>맹관부에 기체가 들어가지 않게 발효관을 세운 다음 솜으로 입구를 막는다.</li><li>맹관부에 모인 기체의 부피를 측정한다.</li></ol>'+
   '<p class="muted" style="margin-top:8px">솜으로 막은 뒤에는 발효관을 흔들지 않습니다.</p></div>';
  var Q={id:'q_fill',q:'맹관부를 용액으로 <b>가득</b> 채워 공기가 남지 않게 하는 까닭으로 알맞은 것은?',
   opts:['용액이 많을수록 효모가 빨리 자라기 때문에','맹관부에 산소가 없어야 효모가 알코올 발효를 하고, 발효로 생긴 기체만 모여 부피를 잴 수 있기 때문에','공기가 있으면 용액이 넘쳐 흐르기 때문에','솜이 젖지 않게 하려고'],a:1,
   why:'맹관부에 처음부터 공기가 있으면 ① 그 안의 <b>산소</b>로 효모가 세포 호흡을 할 수 있고 ② 처음 공기가 <b>측정한 기체 부피에 섞여</b> 결과가 부정확해집니다.',
   bad:{0:'용액의 양은 모두 35 mL 로 같게 정했습니다. 맹관부가 공기 없이 차 있는지가 핵심입니다.',2:'넘치는 것과는 관계없습니다. 맹관부 안의 공기가 무엇을 방해할지 생각해 보세요.',3:'솜은 입구를 막는 데 쓸 뿐입니다.'}};
  quiz(P,Q,sync);
  var QA={id:'qa_air',adv:1,q:'어떤 모둠이 B 의 맹관부 끝에 공기 1.0 mL 를 남긴 채 실험했습니다. 20 분 뒤 이 모둠이 읽은 기체 부피는 제대로 한 모둠과 비교해 어떨까요?',
   opts:['처음 남긴 공기가 더해져 실제로 발효에서 생긴 기체보다 크게 읽힌다','공기가 있으면 발효가 전혀 일어나지 않아 0 mL 로 읽힌다','공기는 용액에 모두 녹으므로 결과에 영향이 없다','공기가 효모에게 산소를 주어 녹말까지 분해하므로 C 의 값이 커진다'],a:0,
   why:'처음 남긴 공기 1.0 mL 가 눈금에 <b>그대로 더해져</b> 읽힙니다. 게다가 그 속의 산소로 효모가 잠깐 세포 호흡을 하므로 조건도 달라집니다. 그래서 맹관부를 <b>공기 없이 가득</b> 채운 뒤 측정을 시작합니다.',
   bad:{1:'산소가 조금 있어도 다 쓰고 나면 발효가 일어납니다. 0 이 되지는 않습니다.',2:'1 mL 의 공기는 짧은 시간에 녹아 사라지지 않습니다.',3:'산소가 있어도 효모가 녹말을 분해하는 효소를 갖게 되는 것은 아닙니다.'}};

/* ---- 6. 항온기 관찰 ---- */
SC.push({id:'incubate',chap:'탐구 수행',name:'항온기에서 관찰',
 guide:'발효가 잘 일어나도록 <span class="hl">40 ℃ 항온기</span>에 세 발효관을 넣고 20 분 동안 관찰합니다. 온도를 맞추고 「시작」을 누르세요.',
 mount:function(P){
  var R=D.run&&D.run.T?D.run:{t:0,T:25,v:{A:0,B:0,C:0},play:false,done:false,hist:[]};
  R.play=false; D.run=R;
  var spd=1.2; /* 1초에 1.2분 */
  var tR,goB,gph;
  canvas(function(c,w,h,t,dt){
    if(R.play&&!R.done){var step=dt*spd;var n=Math.ceil(step/0.05);for(var i=0;i<n;i++){simStep(R,step/n);}
      if(!R.hist.length||R.t-R.hist[R.hist.length-1][0]>=0.5)R.hist.push([R.t,R.v.A,R.v.B,R.v.C]);
      if(R.t>=20){R.t=20;R.done=true;R.play=false;R.hist.push([20,R.v.A,R.v.B,R.v.C]);save();
        toast(R.T===40?'20 분이 지났습니다. 다음 장면에서 기체의 부피를 읽습니다.':'20 분 관찰을 마쳤습니다. 교과서 조건(40 ℃)으로 다시 해야 기록할 수 있습니다.',R.T===40?'good':'bad');sync();}}
    /* 항온기 */
    var bw=Math.min(w-30,560), bh=Math.min(h-30,380), bx=w/2-bw/2, by=h/2-bh/2-4;
    rr(c,bx+5,by+6,bw,bh,18);c.fillStyle='rgba(0,0,0,.45)';c.fill();
    rr(c,bx,by,bw,bh,18);c.fillStyle='#D7DEE8';c.fill();c.lineWidth=4;c.strokeStyle=INK;c.stroke();
    var ix=bx+16,iy=by+48,iw=bw-32,ih=bh-64;
    rr(c,ix,iy,iw,ih,12);c.fillStyle=R.T>=35?'#2A2433':'#1E2A40';c.fill();c.lineWidth=3;c.stroke();
    /* 따뜻한 빛 */
    var warm=clamp((R.T-20)/30,0,1);var g=c.createLinearGradient(0,iy,0,iy+ih);g.addColorStop(0,'rgba(255,170,60,'+(0.10+warm*.22)+')');g.addColorStop(1,'rgba(255,170,60,0)');
    rr(c,ix,iy,iw,ih,12);c.fillStyle=g;c.fill();
    /* 표시창 */
    rr(c,bx+16,by+10,150,30,8);c.fillStyle='#0B1220';c.fill();c.lineWidth=2.5;c.stroke();
    txt(c,R.T.toFixed(1)+' ℃',bx+90,by+26,{col:R.T===40?'#7CFF9E':SUN,size:16,w:900});
    rr(c,bx+bw-166,by+10,150,30,8);c.fillStyle='#0B1220';c.fill();c.stroke();
    var mm=Math.floor(R.t),ss=Math.floor((R.t-mm)*60);
    txt(c,(mm<10?'0':'')+mm+':'+(ss<10?'0':'')+ss+' / 20:00',bx+bw-91,by+26,{col:'#7CC0FF',size:15,w:900});
    c.beginPath();c.arc(bx+bw/2,by+25,7,0,7);c.fillStyle=R.play?'#7CFF9E':'#5B6478';c.fill();c.lineWidth=2;c.stroke();
    /* 발효관 */
    var s=Math.min((ih-34)/300,iw/3/120);
    ['A','B','C'].forEach(function(k,i){var x=ix+iw*(i*2+1)/6, y=iy+ih-24;
      var rate=R.play?(RATE[k]*tempF(R.T)*(R.t>LAG[k]?1:0))/0.35:0;
      drawTube(c,{x:x,y:y,s:s,gas:R.v[k],bulb:.55+R.v[k]*.045,liq:k==='C'?'#EFE6CC':YEAST,cotton:true,scale:true,rate:rate,t:t});
      txt(c,k,x-60*s,y-8,{col:PAPER,size:16,w:900});
      txt(c,{A:'증류수',B:'포도당',C:'녹말'}[k],x+60*s,y-8,{col:'#AFC2DD',size:12,w:900});
    });
    if(!R.play&&R.t===0)hint(R.T===40?'「시작」을 누르세요':'온도 조절기를 40 ℃ 로 맞추세요');
    else if(R.play)hint('발효 중… 맹관부 위쪽에 기체가 모이며 용액이 공 모양 부분으로 밀려납니다');
    else if(R.done)hint(R.T===40?'관찰 완료. 기록판의 그래프를 확인하세요':D.run40?R.T+' ℃ 비교 결과입니다. 40 ℃ 결과와 그래프를 견주어 보세요':'40 ℃ 가 아닌 조건의 결과입니다. 40 ℃ 로 다시 하세요');
    else hint('일시 정지');

  var QA={id:'qa_rest',adv:1,q:'KOH 용액을 넣고 충분히 흔든 뒤에도 기체 0.3 mL 가 남았습니다. 이 결과로 판단한 것으로 가장 알맞은 것은?',
   opts:['남은 0.3 mL 도 이산화 탄소이므로 B 의 이산화 탄소는 6.3 mL 이다','남은 기체는 KOH 에 흡수되지 않는 기체이므로, B 에서 모인 이산화 탄소는 약 6.0 mL 로 볼 수 있다','남은 기체는 에탄올 기체이므로 발효가 일어나지 않았다는 증거이다','KOH 가 이산화 탄소를 만들어 내어 0.3 mL 가 남았다'],a:1,
   why:'KOH 에 흡수된 만큼(6.3 − 0.3 = <b>6.0 mL</b>)이 이산화 탄소입니다. 남은 기체는 처음 용액에 녹아 있다가 빠져나온 공기(질소 등)처럼 <b>KOH 에 흡수되지 않는 기체</b>로 볼 수 있습니다. 측정한 기체가 모두 이산화 탄소라고 단정하지 않는 것이 정확한 해석입니다.',
   bad:{0:'충분히 흔들어도 줄지 않았다면 KOH 에 흡수되지 않는 기체입니다.',2:'에탄올은 이 온도에서 대부분 용액에 녹아 있습니다. 술 냄새는 발효가 일어났다는 증거입니다.',3:'KOH 는 이산화 탄소를 흡수할 뿐 만들지 않습니다.'}};
  quiz(P,QA,sync);
  function sync(){var g=D.koh>=3&&D.smell&&ok('q_koh')&&ok('qa_rest');
    if(g)note('n11b','[심화] 남은 기체','KOH 처리 뒤 남은 0.3 mL 는 흡수되지 않는 기체 → B 의 이산화 탄소는 약 6.3 − 0.3 = 6.0 mL.');
    if(g)note('n11','정리 3 — 이산화 탄소 확인','발효관 B 에 KOH 용액을 넣고 흔들자 맹관부의 기체 '+fmt(TRUE20.B)+' mL 가 0.3 mL 로 줄었다 → 이산화 탄소가 KOH 에 흡수됨.\n발효액에서 술 냄새가 남 → 에탄올 생성.\n(석회수로도 확인할 수 있다)');
    gate(g,D.koh<3?'KOH 로 기체를 확인하고, 냄새를 맡고, 문항을 풀면 넘어갑니다':!D.smell?'냄새도 확인해 보세요':'문항을 모두 풀면 넘어갑니다');}
  sync();
 }});

/* ---- 심화 탐구: 조건을 바꾸면 ---- */
var EXT=[
 {k:'D',t:'끓였다 식힌 효모액 15 + 5 % 포도당 20, 40 ℃',v:0,liq:'#E2D7B6',a:'none',why:'끓이면 효모가 죽고 효소가 변성되어 발효가 일어나지 않습니다.'},
 {k:'E',t:'효모액 15 + 5 % 설탕 20, 40 ℃',v:6.1,liq:YEAST,a:'many',why:'효모는 설탕을 포도당과 과당으로 빠르게 분해하는 효소(인버테이스)를 가지고 있어, 설탕도 포도당과 비슷하게 잘 발효합니다. 녹말과 달리 효모가 직접 분해할 수 있는 이당류입니다.'},
 {k:'F',t:'효모액 15 + 5 % 포도당 20, 25 ℃',v:Math.round(TRUE20.B*tempF(25)*10)/10,liq:YEAST,a:'few',why:'기질은 B 와 같지만 온도가 낮아 효소 반응이 느립니다. 기체가 생기기는 하지만 B 보다 적습니다.'}];
var LV={many:'많다 (B 와 비슷)',few:'B 보다 적다',none:'거의 없다'};
SC.push({id:'extend',chap:'심화',name:'조건을 바꾸면',
 guide:'심화 탐구. 발효관 D, E, F 의 결과를 <span class="hl">먼저 예상</span>한 뒤 실험을 돌려 확인합니다. 예상이 틀려도 괜찮습니다. 왜 그런 결과가 나왔는지가 중요합니다.',
 mount:function(P){
  if(!D.pred)D.pred={};
  var run={t:D.extDone?1:0,on:false};
  var runB;
  canvas(function(c,w,h,t,dt){
    if(run.on){run.t=Math.min(1,run.t+dt/4);if(run.t>=1){run.on=false;D.extDone=1;save();toast('20 분이 지났습니다. 예상과 비교해 보세요.','good');render();sync();}}
    var s=Math.min((h-130)/300,w/4/115);
    var list=[{k:'B',t:'',v:TRUE20.B,liq:YEAST}].concat(EXT);
    list.forEach(function(d,i){var x=w*(i*2+1)/8,y=h-84;var gv=d.v*run.t;
      drawTube(c,{x:x,y:y,s:s,gas:gv,bulb:.55+gv*.045,liq:d.liq,cotton:true,scale:true,rate:run.on&&d.v>0?d.v/6.3:0,t:t});
      txt(c,d.k,x,y+18,{size:16,w:900,col:d.k==='B'?SUN:PAPER});
      if(run.t>0)chip(c,fmt(gv)+' mL',x,y-300*s-16,d.k==='B'?SUN:PAPER,11.5);});
    txt(c,'B 는 비교 기준(40 ℃, 포도당)',12,16,{al:'left',size:12,col:'#AFC2DD'});
    hint(run.on?'발효 중…':run.t>=1?'결과가 나왔습니다. 기록판에서 예상과 견주어 보세요':'기록판에서 D, E, F 의 결과를 예상한 뒤 「실험하기」를 누르세요');
  });
  runB=button('실험하기 (20 분)','pri',function(){
    if(!EXT.every(function(d){return D.pred[d.k];})){toast('D, E, F 를 모두 예상한 뒤 실험하세요.','bad');return;}
    run.t=0;run.on=true;});
  P.innerHTML='<div class="card"><h3>먼저 예상하기</h3><div class="pred" id="pred"></div></div>';
  function render(){var host=$('pred');if(!host)return;host.innerHTML='';
    EXT.forEach(function(d){var row=el('div','prow');row.innerHTML='<span class="pt"><b>'+d.k+'</b>'+d.t+'</span>';
      var seg=el('div','seg');['many','few','none'].forEach(function(v){var b=el('button','',LV[v]);b.type='button';
        var cls='';if(D.pred[d.k]===v)cls='on';if(D.extDone){if(v===d.a)cls='ok';else if(D.pred[d.k]===v)cls='bad';}
        b.className=cls;b.onclick=function(){if(D.extDone)return;D.pred[d.k]=v;save();render();};seg.appendChild(b);});
      row.appendChild(seg);
      if(D.extDone){var e=el('p','small',(D.pred[d.k]===d.a?'<b style="color:#11663A">예상 적중.</b> ':'<b style="color:#9C1E1B">예상과 다름.</b> ')+d.why);e.style.flexBasis='100%';row.appendChild(e);}
      host.appendChild(row);});}
  render();
  var QA={id:'qa_sat',adv:1,q:'알코올 발효에 대한 설명으로 옳은 것만을 &lt;보기&gt;에서 있는 대로 고른 것은?',
   ctx:'<p>ㄱ. 맹관부에 모인 이산화 탄소는 해당 과정에서 생성된다.</p><p>ㄴ. B 의 효모에서는 아세트알데하이드가 NADH 로부터 전자를 받아 에탄올로 환원된다.</p><p>ㄷ. 포도당 1 분자를 분해할 때 효모가 얻는 ATP 는 세포 호흡을 할 때보다 적다.</p>',
   opts:['ㄱ','ㄴ','ㄱ, ㄷ','ㄴ, ㄷ','ㄱ, ㄴ, ㄷ'],a:3,
   why:'ㄱ(×) 해당 과정에서는 CO₂ 가 생기지 않습니다. CO₂ 는 <b>피루브산 → 아세트알데하이드</b> 단계에서 떨어져 나옵니다. ㄴ(○) 아세트알데하이드가 NADH 의 전자를 받아 에탄올이 되며 <b>NAD⁺ 가 재생</b>되어 해당 과정이 계속됩니다. ㄷ(○) 발효는 해당 과정의 2ATP 만 얻습니다.',
   bad:{0:'ㄱ 을 다시 보세요. 해당 과정은 포도당 → 피루브산 단계이며 CO₂ 가 나오지 않습니다.',1:'ㄷ 도 옳습니다. 발효 2ATP, 세포 호흡 최대 32ATP 를 비교해 보세요.',2:'ㄱ 이 틀렸습니다. CO₂ 가 떨어져 나오는 단계는 해당 과정이 아닙니다.',4:'ㄱ 이 틀렸습니다. CO₂ 가 떨어져 나오는 단계는 해당 과정이 아닙니다.'}};
  quiz(P,QA,sync);
  function sync(){var g=D.extDone&&ok('qa_sat');
    if(g){var hit=EXT.filter(function(d){return D.pred[d.k]===d.a;}).length;
      note('n12a','[심화] 조건을 바꾸면','D 끓인 효모액+포도당: 거의 없음 (효소 변성)\nE 효모액+설탕: 많음, B 와 비슷 (설탕 분해 효소 인버테이스가 있음)\nF 포도당, 25 ℃: B 보다 적음 (효소 반응 느림)\n예상 적중 '+hit+' / 3\n알코올 발효에서 CO₂ 는 피루브산 → 아세트알데하이드 단계에서 나오고, NADH 가 아세트알데하이드를 환원해 NAD⁺ 를 재생한다.');}
    gate(g,!D.extDone?'예상하고 실험을 돌린 뒤 문항을 풀면 넘어갑니다':'문항을 풀면 넘어갑니다');}
  sync();
 }});

/* ---- 12. 종합 ---- */
SC.push({id:'wrap',chap:'마무리',name:'알코올 발효 정리',
 guide:'효모 안에서 일어난 일을 정리합니다. 무대의 반응 단계를 <span class="hl">순서대로 눌러</span> 보세요. 마지막으로 스스로 평가합니다.',
 mount:function(P){
  var shown=0;
  var cv=canvas(function(c,w,h,t){
    var steps=[['포도당','C₆H₁₂O₆',SUN],['피루브산 2분자','해당 과정 · 2ATP 생성',PAPER],['아세트알데하이드 2분자','CO₂ 2분자 떨어져 나감',SKY],['에탄올 2분자','NADH → NAD⁺',GRASS]];
    var narrow=w<560, n=steps.length;
    var bw=narrow?Math.min(w-60,300):Math.min(170,(w-40)/n-24), bh=64;
    steps.forEach(function(st,i){var x,y;
      if(narrow){x=w/2-bw/2;y=22+i*(bh+30);}else{x=20+i*((w-40)/n)+((w-40)/n-bw)/2;y=h*.42-bh/2;}
      var vis=i<=shown;
      c.globalAlpha=vis?1:.28;
      rr(c,x+4,y+5,bw,bh,14);c.fillStyle='rgba(0,0,0,.45)';c.fill();rr(c,x,y,bw,bh,14);c.fillStyle=st[2];c.fill();c.lineWidth=3.5;c.strokeStyle=INK;c.stroke();
      txt(c,st[0],x+bw/2,y+24,{col:INK,size:14.5,w:900});txt(c,st[1],x+bw/2,y+46,{col:INK,size:11.5,w:700});
      c.globalAlpha=1;
      if(i<n-1){c.save();c.globalAlpha=i<shown?1:.28;c.strokeStyle=PAPER;c.fillStyle=PAPER;c.lineWidth=3;c.beginPath();
        if(narrow){var ax=w/2,ay=y+bh+4;c.moveTo(ax,ay);c.lineTo(ax,ay+18);c.stroke();c.beginPath();c.moveTo(ax-6,ay+14);c.lineTo(ax,ay+22);c.lineTo(ax+6,ay+14);c.fill();}
        else{var ax2=x+bw+3,ay2=y+bh/2;c.moveTo(ax2,ay2);c.lineTo(ax2+16,ay2);c.stroke();c.beginPath();c.moveTo(ax2+12,ay2-6);c.lineTo(ax2+20,ay2);c.lineTo(ax2+12,ay2+6);c.fill();}
        c.restore();}
      if(i===shown+1)tap(c,x+bw/2,y+bh/2,t);
    });
    if(shown>=n-1){var yy=narrow?22+n*(bh+30)+6:h*.42+bh/2+50;
      txt(c,'포도당 1분자 → 에탄올 2분자 + 이산화 탄소 2분자 + 2ATP',w/2,Math.min(yy,h-50),{size:narrow?12.5:15,w:900,col:SUN});
      txt(c,'아세트알데하이드가 NADH 의 전자를 받아 에탄올이 되며 NAD⁺ 가 재생되어, 산소 없이도 해당 과정이 계속된다',w/2,Math.min(yy+24,h-28),{size:narrow?11:12.5,col:'#AFC2DD'});}
    hint(shown<n-1?'다음 단계를 누르세요':'');
  });
  on(cv.cv,'pointerdown',function(){if(shown<3){shown++;if(shown===3)sync();}});
  P.innerHTML='<div class="card"><h3>스스로 평가하기</h3><div id="evs"></div></div>'+
   '<div class="card"><h3>실험노트 내보내기</h3><p class="small">지금까지 적힌 실험노트를 한꺼번에 복사해 보고서에 붙여 넣을 수 있습니다.</p><div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" type="button" id="openNote">실험노트 열기</button></div></div>';
  var EV=[['k','지식·이해','호흡기질의 종류에 따라 생성되는 이산화 탄소의 양이 다르다는 것을 설명했는가?'],
          ['p','과정·기능','알코올발효 실험을 적절하게 설계하여 수행했는가?'],
          ['v','가치·태도','실험 결과를 있는 그대로 기록했는가?']];
  var ev=$('evs');
  function rEv(){ev.innerHTML='';EV.forEach(function(e){var row=el('div','ev');row.innerHTML='<span><i>'+e[1]+'</i> '+e[2]+'</span>';var stars=el('div','stars');
    for(var i=1;i<=3;i++){(function(i){var b=el('button',(D.stars[e[0]]||0)>=i?'on':'','★');b.type='button';b.setAttribute('aria-label',e[1]+' '+i+'점');b.onclick=function(){D.stars[e[0]]=i;save();rEv();sync();};stars.appendChild(b);})(i);}
    row.appendChild(stars);ev.appendChild(row);});}
  rEv();
  $('openNote').onclick=openNote;
  function sync(){var all=EV.every(function(e){return D.stars[e[0]];});
    if(all)note('n13','스스로 평가하기',EV.map(function(e){return e[1]+' '+'★★★'.slice(0,D.stars[e[0]])+'☆☆☆'.slice(0,3-D.stars[e[0]]);}).join('\n'));
    gate(false,shown>=3&&all?'실험을 모두 마쳤습니다. 실험노트에서 기록을 복사할 수 있습니다.':'반응 단계를 끝까지 누르고 스스로 평가를 마치세요');
    if(shown>=3&&all){$('gateMsg').className='ok';if(D.max<SC.length){D.max=SC.length;save();drawRail();}}}
  sync();
 }});

/* ===================================================================== 진행 */
function drawRail(){var r=$('rail');var h='',lastC='';
  SC.forEach(function(s,i){if(s.chap!==lastC){h+='<div class="chap">'+s.chap+'</div>';lastC=s.chap;}
    var cls='sc'+(i===D.cur?' now':'')+(i<D.max||(i===SC.length-1&&D.max>=SC.length)?' done':'');
    h+='<button type="button" class="'+cls+'" data-i="'+i+'"'+(i>D.max?' disabled':'')+'><span class="no">'+(i+1)+'</span>'+s.name+'</button>';});
  r.innerHTML=h;r.querySelectorAll('.sc').forEach(function(b){b.onclick=function(){go(+b.dataset.i);};});
  var now=r.querySelector('.now');if(now&&now.scrollIntoView&&getComputedStyle(r).display==='flex'){var rb=r.getBoundingClientRect(),nb=now.getBoundingClientRect();r.scrollLeft+=nb.left-rb.left-rb.width/2+nb.width/2;}
}
function go(i){
  if(live)live.forEach(function(f){try{f();}catch(e){}});live=[];
  D.cur=clamp(i,0,SC.length-1);save();
  var s=SC[D.cur];
  $('chapTag').textContent=s.chap;$('scName').textContent=s.name;$('cnt').textContent=(D.cur+1)+' / '+SC.length;
  $('guide').innerHTML=s.guide;$('ctrl').innerHTML='';$('panel').innerHTML='';hint('');
  $('prev').disabled=D.cur===0;gate(false,'');
  s.mount($('panel'));
  drawRail();
}
$('prev').onclick=function(){go(D.cur-1);window.scrollTo({top:0,behavior:'smooth'});};
$('next').onclick=function(){if(gateOK){go(D.cur+1);window.scrollTo({top:0,behavior:'smooth'});}};
$('resetBtn').onclick=function(){var b=$('resetBtn');if(b.dataset.c){D=fresh();save();$('noteN').textContent='0';b.textContent='처음부터';delete b.dataset.c;go(0);toast('기록을 모두 지우고 처음부터 시작합니다.');}
  else{b.dataset.c=1;b.textContent='한 번 더 누르면 초기화';setTimeout(function(){delete b.dataset.c;b.textContent='처음부터';},3000);}};
function nsort(a,b){var d=parseFloat(a.slice(1))-parseFloat(b.slice(1));return d||(a<b?-1:a>b?1:0);}
function noteText(){var keys=D.noteOrder.slice().sort(nsort);
  return '[실험노트] 발효 실험 설계하여 수행하기\n'+keys.map(function(k){return '■ '+D.notes[k].t+'\n'+D.notes[k].x;}).join('\n\n');}
function openNote(){var keys=D.noteOrder.slice().sort(nsort);
  $('noteBody').innerHTML=keys.length?keys.map(function(k){return '<div class="nt"><b>'+D.notes[k].t+'</b><pre>'+D.notes[k].x.replace(/</g,'&lt;')+'</pre></div>';}).join(''):'<p class="nt">아직 적힌 내용이 없습니다.</p>';
  $('noteTxt').hidden=true;$('noteDlg').hidden=false;$('noteClose').focus();}
$('noteBtn').onclick=openNote;
$('noteClose').onclick=function(){$('noteDlg').hidden=true;};
$('noteDlg').onclick=function(e){if(e.target===$('noteDlg'))$('noteDlg').hidden=true;};
document.addEventListener('keydown',function(e){if(e.key==='Escape')$('noteDlg').hidden=true;});
$('noteCopy').onclick=function(){var s=noteText();
  try{navigator.clipboard.writeText(s).then(function(){toast('실험노트를 복사했습니다.','good');},fallback);}catch(e){fallback();}
  function fallback(){var ta=$('noteTxt');ta.hidden=false;ta.value=s;ta.focus();ta.select();toast('아래 글상자가 선택되었습니다. 직접 복사하세요.');}};
$('noteN').textContent=D.noteOrder.length;
go(Math.min(D.cur,D.max));
})();
</script>
